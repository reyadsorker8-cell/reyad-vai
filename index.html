<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VP Personal Hack</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>

        /* ═══════════════════════════════════════════
           BASE / RESET — ডার্ক ব্যাকগ্রাউন্ড (গ্লো হলুদ থিম)
           ═══════════════════════════════════════════ */
        html, body {
            background: #0f0c00 !important;
            background-color: #0f0c00 !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        /* ═══════════════════════════════════════════
           FULL SCREEN IFRAME & VIDEO
           ═══════════════════════════════════════════ */
        #fullscreen-bg-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: 0;
            z-index: 1;
            background: #0f0c00;
            pointer-events: auto;
            display: block;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* ═══════════════════════════════════════════
           BACKGROUND VIDEO STYLES (CARD & FULLSCREEN)
           ═══════════════════════════════════════════ */
        #fullscreen-bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            display: none;
            background: #0f0c00;
        }

        /* কার্ডের ব্যাকগ্রাউন্ড ভিডিও */
        #tufan-widget-root .box-bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            border-radius: 36px;
            opacity: 0.8;
            filter: contrast(1.1) brightness(0.95);
        }
        #tufan-widget-root .box-video-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            border-radius: 36px;
            background: radial-gradient(circle at 50% 20%, rgba(0,0,0,0.1), rgba(15,12,0,0.65) 85%);
        }

        /* ═══════════════════════════════════════════
           WIDGET ROOT & VARIABLES (GLOW YELLOW THEME)
           ═══════════════════════════════════════════ */
        #tufan-widget-root {
            --green: #ffe600;       /* প্রাইমারি গ্লো হলুদ */
            --green2: #ffb700;      /* সেকেন্ডারি গোল্ডেন হলুদ */
            --lime: #fff740;        /* ব্রাইট সফট ইয়েলো */
            --cyan: #00eaff;
            --gold: #ffe600;
            --red: #ff225d;
            --purple: #bc28ff;
            --ink: #0a0800;
            --panel: #141000;
            --flight: 2.25s;
            --scan-progress: 0;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
            overflow: visible;
        }
        #tufan-widget-root .launcher,
        #tufan-widget-root .wrap {
            pointer-events: auto;
        }
        #tufan-widget-root,
        #tufan-widget-root * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: Orbitron, sans-serif;
        }
        #tufan-widget-root .hidden { display: none !important; }

        /* ═══════════════════════════════════════════
           LAUNCHER (Floating Orb)
           ═══════════════════════════════════════════ */
        #tufan-widget-root .launcher {
            position: fixed; left: 0; top: 0; width: 58px; height: 58px;
            z-index: 9999; display: grid; place-items: center;
            border: 1.5px solid rgba(255,230,0,.65); border-radius: 50%;
            cursor: grab; touch-action: none;
            background: radial-gradient(circle at 32% 25%, rgba(255,230,0,.34), transparent 48%),
                        linear-gradient(145deg, #2c2000, #0d0900 62%, #000);
            box-shadow: 0 12px 28px #000, 0 0 18px rgba(255,230,0,.48), inset 0 0 15px rgba(255,230,0,.24);
            will-change: transform;
        }
        #tufan-widget-root .launcher:active { cursor: grabbing; }
        @keyframes sxOrbCoreFloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(2deg); } }
        #tufan-widget-root .launcher-glass {
            position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.14);
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,.16), transparent 55%);
        }
        #tufan-widget-root .launcher-core {
            position: relative; z-index: 4; width: 72%; height: 72%;
            display: grid; place-items: center; overflow: hidden; border-radius: 50%;
            filter: drop-shadow(0 0 6px var(--green));
            animation: sxOrbCoreFloat 3.8s ease-in-out infinite;
        }
        #tufan-widget-root .launcher-icon-img {
            width: 100%; height: 100%; display: block; object-fit: cover;
            border-radius: 50%; pointer-events: none;
        }
        #tufan-widget-root .launcher-fallback {
            font: 900 17px 'Chakra Petch', sans-serif;
            color: var(--green); text-shadow: 0 0 8px var(--green);
        }
        #tufan-widget-root .launcher-ring {
            position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px);
            pointer-events: none;
        }
        #tufan-widget-root .launcher-ring circle {
            fill: none; stroke: var(--green); stroke-width: 1.7;
            stroke-linecap: round; stroke-dasharray: 28 16;
            transform-origin: 50% 50%; animation: sxSpin 6s linear infinite;
            filter: drop-shadow(0 0 3px var(--green));
        }
        #tufan-widget-root .launcher-ring .r2 {
            stroke: var(--lime); stroke-width: 1.1;
            stroke-dasharray: 8 21; animation-duration: 4s; animation-direction: reverse;
        }
        #tufan-widget-root .launcher-orbit {
            position: absolute; inset: -6px; z-index: 3;
            animation: sxSpin 3s linear infinite;
        }
        #tufan-widget-root .launcher-orbit i {
            position: absolute; top: -2px; left: 50%; width: 5px; height: 5px;
            border-radius: 50%; background: #fff; box-shadow: 0 0 9px var(--lime);
        }
        @keyframes sxSpin { to { transform: rotate(360deg); } }

        /* ═══════════════════════════════════════════
           MAIN PANEL WRAP
           ═══════════════════════════════════════════ */
        #tufan-widget-root .wrap {
            position: fixed; left: 0; top: 0; z-index: 10000;
            display: none; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; touch-action: none;
            scale: .9; transition: opacity .2s ease, scale .25s cubic-bezier(.2,.9,.2,1.1);
            will-change: transform;
        }
        #tufan-widget-root .wrap.visible {
            display: flex; opacity: 1; pointer-events: auto; scale: 1;
        }
        #tufan-widget-root .wrap.dragging { transition: none !important; }

        /* ═══════════════════════════════════════════
           FLIGHT CHASSIS & WINGS
           ═══════════════════════════════════════════ */
        #tufan-widget-root .flight-chassis {
            position: relative; display: flex; align-items: center; justify-content: center;
            will-change: transform;
        }
        #tufan-widget-root .wing-backlight {
            position: absolute; width: 280px; height: 160px; z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse, rgba(255,230,0,.045), transparent 70%);
            filter: blur(8px);
        }
        #tufan-widget-root .wing {
            position: absolute; top: 48%; width: 220px; height: 165px; z-index: 1;
            pointer-events: none;
            background: url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat;
            filter: hue-rotate(-55deg) drop-shadow(0 0 4px rgba(255,230,0,.35));
            will-change: transform;
        }
        #tufan-widget-root .wing.left {
            left: -80px; background-position: left center;
            clip-path: polygon(0 0, 66% 0, 66% 100%, 0 100%);
            transform-origin: right 58%;
            animation: sxFlapL var(--flight) ease-in-out infinite;
        }
        #tufan-widget-root .wing.right {
            right: -80px; background-position: right center;
            clip-path: polygon(34% 0, 100% 0, 100% 100%, 34% 100%);
            transform-origin: left 58%;
            animation: sxFlapR var(--flight) ease-in-out infinite;
        }
        @keyframes sxFlapL { 0%, 100% { transform: translateY(-50%) rotate(-12deg) scaleY(.94); } 50% { transform: translateY(-50%) rotate(14deg) scaleY(1.06); } }
        @keyframes sxFlapR { 0%, 100% { transform: translateY(-50%) rotate(12deg) scaleY(.94); } 50% { transform: translateY(-50%) rotate(-14deg) scaleY(1.06); } }

        #tufan-widget-root .wing-particles {
            position: absolute; top: 48%; width: 220px; height: 165px; z-index: 2;
            pointer-events: none; transform: translateY(-50%);
        }
        #tufan-widget-root .wing-particles.left { left: -80px; animation: sxFlapL var(--flight) ease-in-out infinite; }
        #tufan-widget-root .wing-particles.right { right: -80px; animation: sxFlapR var(--flight) ease-in-out infinite; }
        #tufan-widget-root .wp {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #ffffef 20%, #fffc9d 48%, #ffd834 72%, transparent 88%);
            box-shadow: 0 0 4px rgba(255,255,255,.95), 0 0 8px rgba(255,248,135,.62), 0 0 14px rgba(255,235,70,.32);
            opacity: 0; will-change: transform, opacity;
        }
        #tufan-widget-root .wp.p1 { top: 20%; left: 15%; animation: sxWingP1 2.4s ease-in-out infinite; }
        #tufan-widget-root .wp.p2 { top: 40%; left: 8%; width: 2px; height: 2px; animation: sxWingP2 2.8s ease-in-out .3s infinite; }
        #tufan-widget-root .wp.p3 { top: 60%; left: 22%; width: 3px; height: 3px; animation: sxWingP3 2.2s ease-in-out .6s infinite; }
        #tufan-widget-root .wp.p4 { top: 30%; left: 35%; width: 2px; height: 2px; background: radial-gradient(circle, #fff 0%, #ffffdf 26%, #fff563 58%, transparent 82%); box-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 10px rgba(255,242,95,.48); animation: sxWingP4 2.6s ease-in-out .9s infinite; }
        #tufan-widget-root .wp.p5 { top: 75%; left: 12%; width: 2px; height: 2px; background: radial-gradient(circle, #fff 0%, #ffffe9 28%, #ffee52 58%, transparent 82%); box-shadow: 0 0 5px rgba(255,255,255,.9), 0 0 10px rgba(255,238,82,.46); animation: sxWingP5 2.3s ease-in-out 1.1s infinite; }
        #tufan-widget-root .wp.p6 { top: 50%; left: 45%; width: 2px; height: 2px; animation: sxWingP6 2.5s ease-in-out .4s infinite; }
        @keyframes sxWingP1 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 20% { opacity: 1; transform: scale(1); } 50% { transform: translate(-18px,-14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP2 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(-14px,10px) scale(1.4); opacity: .9; } }
        @keyframes sxWingP3 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; transform: scale(1); } 50% { transform: translate(-20px,-8px) scale(1.3); opacity: 1; } }
        @keyframes sxWingP4 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 55% { transform: translate(-12px,-18px) scale(1.5); opacity: .95; } }
        @keyframes sxWingP5 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(-16px,14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP6 { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(-22px,-6px) scale(1.3); opacity: .9; } }
        #tufan-widget-root .wing-particles.right .wp { transform: scaleX(-1); }
        #tufan-widget-root .wing-particles.right .wp.p1 { animation: sxWingP1R 2.4s ease-in-out infinite; }
        #tufan-widget-root .wing-particles.right .wp.p2 { animation: sxWingP2R 2.8s ease-in-out .3s infinite; }
        #tufan-widget-root .wing-particles.right .wp.p3 { animation: sxWingP3R 2.2s ease-in-out .6s infinite; }
        #tufan-widget-root .wing-particles.right .wp.p4 { animation: sxWingP4R 2.6s ease-in-out .9s infinite; }
        #tufan-widget-root .wing-particles.right .wp.p5 { animation: sxWingP5R 2.3s ease-in-out 1.1s infinite; }
        #tufan-widget-root .wing-particles.right .wp.p6 { animation: sxWingP6R 2.5s ease-in-out .4s infinite; }
        @keyframes sxWingP1R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 20% { opacity: 1; transform: scale(1); } 50% { transform: translate(18px,-14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP2R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(14px,10px) scale(1.4); opacity: .9; } }
        @keyframes sxWingP3R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(20px,-8px) scale(1.3); opacity: 1; } }
        @keyframes sxWingP4R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 55% { transform: translate(12px,-18px) scale(1.5); opacity: .95; } }
        @keyframes sxWingP5R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 25% { opacity: 1; } 50% { transform: translate(16px,14px) scale(1.2); opacity: 1; } }
        @keyframes sxWingP6R { 0%, 100% { transform: translate(0,0) scale(0); opacity: 0; } 30% { opacity: 1; } 50% { transform: translate(22px,-6px) scale(1.3); opacity: .9; } }

        #tufan-widget-root .claw-layer {
            position: absolute; top: 32px; width: 42px; height: 165px;
            z-index: 25; pointer-events: none;
        }
        #tufan-widget-root .claw-layer.left { left: -20px; }
        #tufan-widget-root .claw-layer.right { right: -20px; transform: scaleX(-1); }
        #tufan-widget-root .claw-shake { width: 100%; height: 100%; animation: sxClawShake 7.5s infinite; }
        #tufan-widget-root .finger { position: absolute; width: 100%; transform-origin: left center; }
        #tufan-widget-root .f1 { top: 10px; animation: sxF1 3s infinite; }
        #tufan-widget-root .f2 { top: 45px; animation: sxF2 4s -1.2s infinite; }
        #tufan-widget-root .f3 { top: 82px; animation: sxF3 3.5s -2s infinite; }
        #tufan-widget-root .f4 { top: 118px; animation: sxF4 5s -3s infinite; }
        #tufan-widget-root .f-base {
            position: absolute; left: 0; width: 21px; height: 11px;
            border-top: 1px solid rgba(255,245,100,.5); border-radius: 6px 0 0 6px;
            background: linear-gradient(#6c5600, #0a0800); box-shadow: 2px 2px 5px #000;
        }
        #tufan-widget-root .f-mid {
            position: absolute; left: 18px; top: 1px; width: 14px; height: 9px;
            border-radius: 2px; background: linear-gradient(#a58408, #0a0800);
            transform: rotate(-12deg); transform-origin: left;
        }
        #tufan-widget-root .f-tip {
            position: absolute; left: 10px; top: 1px; width: 23px; height: 8px;
            clip-path: polygon(0 10%, 100% 45%, 0 90%, 25% 45%);
            background: linear-gradient(90deg, #fff, #ffe600 36%, #4f3d00);
            filter: drop-shadow(0 0 3px var(--green));
            transform: rotate(-24deg); transform-origin: left;
        }
        @keyframes sxClawShake { 66%, 78% { transform: translate(1.5px,-1px); } 68%, 80% { transform: translate(-1.5px,1px); } }
        @keyframes sxF1 { 0%, 100% { transform: rotate(24deg); } 25% { transform: rotate(29deg); } }
        @keyframes sxF2 { 0%, 100% { transform: rotate(9deg); } 30% { transform: rotate(14deg); } }
        @keyframes sxF3 { 0%, 100% { transform: rotate(-6deg); } 20% { transform: rotate(-2deg); } }
        @keyframes sxF4 { 0%, 100% { transform: rotate(-21deg); } 35% { transform: rotate(-15deg); } }

        /* ═══════════════════════════════════════════
           BOX WRAPPER & CHASSIS
           ═══════════════════════════════════════════ */
        #tufan-widget-root .box-wrapper {
            position: relative; z-index: 10; width: 218px; height: 276px;
            display: flex; overflow: hidden; padding: 2px; border-radius: 38px;
            background: #000; isolation: isolate; cursor: grab;
            box-shadow: 0 0 30px rgba(255,230,0,.38), 0 18px 50px rgba(0,0,0,.96);
        }
        #tufan-widget-root .box-wrapper:active { cursor: grabbing; }
        #tufan-widget-root .box-wrapper:before,
        #tufan-widget-root .box-wrapper:after {
            content: ""; position: absolute; left: -75%; top: -75%;
            width: 250%; height: 250%; z-index: 0;
            background: conic-gradient(from 0deg, transparent 64%, var(--green) 77%, #fff 82%, var(--cyan) 87%, transparent 100%);
            animation: sxPlasma 3.8s linear infinite;
        }
        #tufan-widget-root .box-wrapper:after {
            background: conic-gradient(from 180deg, transparent 64%, var(--green2) 77%, var(--gold) 82%, var(--lime) 88%, transparent 100%);
            animation-duration: 5.2s; animation-direction: reverse; opacity: .72;
        }
        @keyframes sxPlasma { to { transform: rotate(360deg); } }

        #tufan-widget-root .box {
            position: relative; z-index: 2; width: 100%; height: 100%;
            overflow: hidden; border-radius: 36px; padding: 10px 9px 9px;
            background: radial-gradient(circle at 50% -10%, rgba(120,95,0,.72), transparent 53%),
                        linear-gradient(rgba(18,14,0,.85), rgba(15,10,0,.9) 57%, rgba(0,2,1,.95));
            box-shadow: inset 0 0 22px rgba(255,230,0,.24);
        }
        #tufan-widget-root .box:after {
            content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(112deg, transparent 20%, rgba(255,255,255,.08) 35%, transparent 49%);
            transform: translateX(-130%); animation: sxPanelShine 6.3s linear infinite;
        }
        @keyframes sxPanelShine { to { transform: translateX(160%); } }
        #tufan-widget-root .ambient {
            position: absolute; inset: -40%; z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 30% 70%, rgba(0,234,255,.08), transparent 28%),
                        radial-gradient(circle at 65% 35%, rgba(255,230,0,.15), transparent 30%);
            filter: blur(13px); animation: sxAmbient 10s ease-in-out infinite alternate;
        }
        @keyframes sxAmbient { to { transform: rotate(24deg) scale(1.15); } }
        #tufan-widget-root .dot-field {
            position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
        }
        #tufan-widget-root .dot-field i {
            position: absolute; bottom: -8px; width: 3px; height: 3px; border-radius: 50%;
            background: var(--green); box-shadow: 0 0 5px var(--green);
            opacity: 0; animation: sxRise 5s linear infinite;
        }
        #tufan-widget-root .dot-field i:nth-child(1) { left: 12%; animation-delay: 0s; }
        #tufan-widget-root .dot-field i:nth-child(2) { left: 29%; animation-delay: 1.2s; animation-duration: 6s; }
        #tufan-widget-root .dot-field i:nth-child(3) { left: 49%; animation-delay: 2.4s; }
        #tufan-widget-root .dot-field i:nth-child(4) { left: 72%; animation-delay: .6s; animation-duration: 5.8s; }
        #tufan-widget-root .dot-field i:nth-child(5) { left: 87%; animation-delay: 3s; animation-duration: 4.7s; }
        @keyframes sxRise { 20%, 78% { opacity: .8; } to { transform: translateY(-285px) scale(1.25); opacity: 0; } }

        #tufan-widget-root .gloss-stream {
            position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3;
        }
        #tufan-widget-root .gloss-line {
            position: absolute; width: 1.5px; border-radius: 2px; opacity: 0;
            background: linear-gradient(180deg, transparent, rgba(255,230,0,.2) 20%, #fff 60%, rgba(255,230,0,.9) 80%, transparent);
            filter: drop-shadow(0 0 3px var(--green));
            animation: sxGlossFall linear infinite;
        }
        #tufan-widget-root .gl-1 { left: 16%; height: 46px; animation-duration: 2.6s; }
        #tufan-widget-root .gl-2 { left: 38%; height: 32px; animation-duration: 3.2s; animation-delay: 1.1s; }
        #tufan-widget-root .gl-3 { left: 64%; height: 52px; animation-duration: 2.2s; animation-delay: .5s; }
        #tufan-widget-root .gl-4 { left: 84%; height: 38px; animation-duration: 3s; animation-delay: 1.7s; }
        #tufan-widget-root .gl-5 { left: 50%; height: 44px; animation-duration: 2.8s; animation-delay: 2.1s; }
        @keyframes sxGlossFall { 0% { transform: translateY(-60px); opacity: 0; } 25%, 75% { opacity: .9; } 100% { transform: translateY(290px); opacity: 0; } }
        #tufan-widget-root .panel-sweep {
            position: absolute; inset: 0; z-index: 3; pointer-events: none;
            overflow: hidden; border-radius: 36px;
        }
        #tufan-widget-root .panel-sweep:before {
            content: ""; position: absolute; top: -30%; left: -60%;
            width: 60%; height: 160%;
            background: linear-gradient(90deg, transparent, rgba(255,230,0,.07) 45%, rgba(255,255,255,.12) 50%, rgba(255,230,0,.07) 55%, transparent);

        /* ═══════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════ */

        #tufan-widget-root .card-title {

        /* ═══════════════════════════════════════════
           STAGE
           ═══════════════════════════════════════════ */
        #tufan-widget-root .stage {
            position: relative; flex: 1; display: grid; place-items: center; margin: 4px 0;
        }
        #tufan-widget-root .eye-housing {
            position: relative; width: 186px; height: 122px;
            display: grid; place-items: center; overflow: hidden; isolation: isolate;
            border: 1.2px solid rgba(255,230,0,.58); border-radius: 19px;
            background: radial-gradient(circle, rgba(0,234,255,.08), transparent 58%),
                        linear-gradient(145deg, rgba(27,21,0,.98), rgba(0,5,2,.99));
            box-shadow: 0 0 19px rgba(255,230,0,.35), inset 0 0 24px rgba(255,230,0,.2);
            perspective: 520px;
        }
        #tufan-widget-root .stage-grid {
            position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .55;
            background-image: linear-gradient(rgba(255,230,0,.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,230,0,.1) 1px, transparent 1px);

            mask-image: radial-gradient(circle, #000 20%, transparent 84%);

        #tufan-widget-root .corner {
            position: absolute; z-index: 40; width: 8px; height: 8px;
            border-color: var(--green); border-style: solid;
            filter: drop-shadow(0 0 3px var(--green)); pointer-events: none;
        }
        #tufan-widget-root .corner.tl { top: 4px; left: 4px; border-width: 1.5px 0 0 1.5px; }
        #tufan-widget-root .corner.tr { top: 4px; right: 4px; border-width: 1.5px 1.5px 0 0; }
        #tufan-widget-root .corner.bl { bottom: 4px; left: 4px; border-width: 0 0 1.5px 1.5px; }
        #tufan-widget-root .corner.br { right: 4px; bottom: 4px; border-width: 0 1.5px 1.5px 0; }

        #tufan-widget-root .eye-ring {
            position: relative; z-index: 5; width: 87px; height: 55px;
            display: grid; place-items: center;
            border: 1px solid rgba(255,230,0,.45); border-radius: 13px;
            background: radial-gradient(circle, rgba(66,52,0,.9), rgba(0,0,0,.45));
            box-shadow: inset 0 0 14px rgba(255,230,0,.3), 0 0 12px rgba(255,230,0,.25);
            animation: sxEyeRing 7s linear infinite;
            transition: opacity .25s;
        }
        #tufan-widget-root .eye-upright {
            width: 55px; height: 29px; display: grid; place-items: center;
            animation: sxEyeCounter 7s linear infinite;
        }
        #tufan-widget-root .eye-blink {
            width: 100%; height: 100%;
            animation: sxOrganicBlink 7s cubic-bezier(.8,0,.2,1) infinite;
        }
        #tufan-widget-root .dragon-eye {
            position: relative; width: 100%; height: 100%;
            display: grid; place-items: center;
            clip-path: path('M 0 14 Q 27 -5 54 14 Q 27 33 0 14');
            background: radial-gradient(ellipse, #6d5500, #1a1400 78%, #000);
        }
        #tufan-widget-root .iris {
            position: relative; width: 22px; height: 22px;
            display: grid; place-items: center; overflow: hidden; border-radius: 50%;
            background: radial-gradient(circle, #ffffff 5%, #ffee33 30%, #cca300 62%, #2a2000);
            box-shadow: 0 0 15px rgba(255,230,0,.9);
            animation: sxEyeScan 10s ease-in-out infinite;
        }
        #tufan-widget-root .pupil {
            width: 3px; height: 17px; border-radius: 50%;
            background: #000; box-shadow: 0 0 6px var(--green);
        }
        #tufan-widget-root .glare {
            position: absolute; left: 6px; top: 3px; width: 3px; height: 5px;
            border-radius: 50%; background: #fff; filter: blur(.3px);
        }
        @keyframes sxEyeRing { to { transform: rotate(360deg); } }
        @keyframes sxEyeCounter { to { transform: rotate(-360deg); } }
        @keyframes sxOrganicBlink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 92%, 98% { transform: scaleY(.04); } }
        @keyframes sxEyeScan { 25%, 35% { transform: translate(-4px,-2px); } 45%, 55% { transform: translate(4px,2px); } 65% { transform: scale(1.1); } }

        /* ═══════════════════════════════════════════
           STATUS OVERLAY
           ═══════════════════════════════════════════ */
        #tufan-widget-root .status-overlay {
            position: absolute; inset: 0; z-index: 60;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 6px 10px;
            background: rgba(18, 14, 0, 0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 19px;
        }
        #tufan-widget-root .status-overlay.show { display: flex !important; }
        #tufan-widget-root .status-main {
            color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1px;
            text-shadow: 0 0 8px #fff, 0 0 14px var(--green);
            margin-bottom: 2px;
        }
        #tufan-widget-root .status-sub {
            margin-top: 3px; color: var(--cyan);
            font: 700 8px 'Share Tech Mono', monospace;
            text-shadow: 0 0 6px var(--cyan);
        }
        #tufan-widget-root .status-hint {
            margin-top: 3px; color: var(--gold);
            font: 700 7px 'Share Tech Mono', monospace;
            text-shadow: 0 0 4px var(--gold);
        }
        #tufan-widget-root .pw-input-wrap {
            margin-top: 8px; width: 94%; display: none;
            position: relative; z-index: 61;
        }
        #tufan-widget-root .pw-input-wrap.show { display: block !important; }
        #tufan-widget-root .pw-input {
            width: 100%; padding: 8px 10px;
            border: 1.5px solid var(--green);
            border-radius: 8px;
            background: rgba(20,16,0,.95);
            color: #fff;
            font: 700 12px 'Share Tech Mono', monospace;
            letter-spacing: 2px; text-align: center;
            outline: none;
            box-shadow: 0 0 12px rgba(255,230,0,.5), inset 0 0 10px rgba(255,230,0,.25);
            -webkit-user-select: text;
            user-select: text;

        #tufan-widget-root .pw-input::placeholder {
            color: rgba(255,255,255,.4);
            letter-spacing: 1px;
            font-size: 9px;
        }
        #tufan-widget-root .pw-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 14px rgba(0,234,255,.7), inset 0 0 10px rgba(0,234,255,.3);
        }
        #tufan-widget-root .pw-msg {
            margin-top: 4px; font: 700 7px 'Share Tech Mono', monospace;
            color: var(--red); text-shadow: 0 0 4px var(--red);
            min-height: 10px;
        }

        /* ═══════════════════════════════════════════
           STAGE SCANNER
           ═══════════════════════════════════════════ */
        #tufan-widget-root .stageScanner {
            position: absolute; inset: 0; z-index: 30;
            display: none; overflow: hidden; transform-style: preserve-3d;
            background: radial-gradient(circle at 50% 52%, rgba(0,234,255,.11), transparent 37%),
                        radial-gradient(circle at 50% 52%, rgba(255,230,0,.09), transparent 65%);
        }
        #tufan-widget-root .stageScanner.active { display: block; }
        #tufan-widget-root .housingScanCanvas {
            position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%;
            pointer-events: none;
        }
        #tufan-widget-root .scan-vignette {
            position: absolute; inset: 0; z-index: 18; pointer-events: none;
            box-shadow: inset 0 0 20px #000, inset 0 0 8px rgba(255,230,0,.35);
        }
        #tufan-widget-root .scan-depth-grid {
            position: absolute; left: -20%; right: -20%; bottom: -62%; height: 130%;
            z-index: 1; transform: rotateX(67deg); transform-origin: 50% 0;
            background-image: linear-gradient(rgba(0,234,255,.22) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,230,0,.18) 1px, transparent 1px);
            background-size: 12px 12px;

            -webkit-mask-image: linear-gradient(transparent, #000 35%, transparent 88%);

        @keyframes sxGridDrive { to { background-position: 0 12px; } }
        #tufan-widget-root .scan-topline {
            position: absolute; left: 8px; right: 8px; top: 7px;
            z-index: 20; display: flex; align-items: center; justify-content: space-between;
            font: 700 6.5px 'Share Tech Mono', monospace; letter-spacing: .1em;
        }
        #tufan-widget-root .scan-chip {
            padding: 2px 5px; border: 1px solid rgba(0,234,255,.5); border-radius: 4px;
            color: var(--cyan); background: rgba(0,15,18,.75);
            box-shadow: 0 0 7px rgba(0,234,255,.2);
        }
        #tufan-widget-root .scan-chip.live {
            color: var(--green); border-color: rgba(255,230,0,.55);
        }
        #tufan-widget-root .scan-chip.live:before {
            content: "●"; margin-right: 3px; animation: sxBlink .7s infinite;
        }
        #tufan-widget-root .scan-reactor {
            position: absolute; left: 50%; top: 50%; z-index: 8;

            transform: translate(-50%,-50%); transform-style: preserve-3d;
            filter: drop-shadow(0 0 7px rgba(0,234,255,.48));
        }
        #tufan-widget-root .scan-orbit {
            position: absolute; inset: 4px;
            border: 1px solid var(--cyan); border-radius: 50%;
            transform-style: preserve-3d;
            box-shadow: 0 0 8px rgba(0,234,255,.35), inset 0 0 7px rgba(0,234,255,.2);
        }
        #tufan-widget-root .scan-orbit:before,
        #tufan-widget-root .scan-orbit:after {
            content: ""; position: absolute; width: 4px; height: 4px;
            border-radius: 50%; background: #fff; box-shadow: 0 0 7px currentColor;
        }
        #tufan-widget-root .scan-orbit:before { left: 7px; top: 5px; }
        #tufan-widget-root .scan-orbit:after { right: 4px; bottom: 12px; }
        #tufan-widget-root .orbit-a {
            color: var(--cyan); transform: rotateX(66deg) rotateZ(0);
            animation: sxOrbitA 1.2s linear infinite;
        }
        #tufan-widget-root .orbit-b {
            inset: 10px; color: var(--green); border-color: var(--green);
            transform: rotateY(68deg) rotateZ(25deg);
            animation: sxOrbitB 1.5s linear infinite reverse;
        }
        #tufan-widget-root .orbit-c {
            inset: 16px; color: var(--gold); border-color: var(--gold);
            transform: rotateX(58deg) rotateY(56deg);
            animation: sxOrbitC 1s linear infinite;
        }
        @keyframes sxOrbitA { to { transform: rotateX(66deg) rotateZ(360deg); } }
        @keyframes sxOrbitB { to { transform: rotateY(68deg) rotateZ(385deg); } }
        @keyframes sxOrbitC { to { transform: rotateX(58deg) rotateY(56deg) rotateZ(360deg); } }
        #tufan-widget-root .core-cube {
            position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
            transform-style: preserve-3d;
            transform: translate(-50%,-50%) rotateX(-22deg) rotateY(35deg);
            animation: sxCubeTurn 2.2s linear infinite;
        }
        #tufan-widget-root .cube-face {
            position: absolute; inset: 0;
            border: 1px solid rgba(255,255,255,.8);
            background: linear-gradient(135deg, rgba(0,234,255,.75), rgba(255,230,0,.18));
            box-shadow: inset 0 0 7px rgba(255,255,255,.5), 0 0 8px var(--cyan);
            backface-visibility: visible;
        }
        #tufan-widget-root .cube-face.f  { transform: translateZ(9px); }
        #tufan-widget-root .cube-face.b  { transform: rotateY(180deg) translateZ(9px); }
        #tufan-widget-root .cube-face.r  { transform: rotateY(90deg) translateZ(9px); }
        #tufan-widget-root .cube-face.l  { transform: rotateY(-90deg) translateZ(9px); }
        #tufan-widget-root .cube-face.t  { transform: rotateX(90deg) translateZ(9px); }
        #tufan-widget-root .cube-face.bt { transform: rotateX(-90deg) translateZ(9px); }
        @keyframes sxCubeTurn { to { transform: translate(-50%,-50%) rotateX(338deg) rotateY(395deg); } }
        #tufan-widget-root .scan-halo {
            position: absolute; left: 50%; top: 50%; z-index: 6;
            width: 82px; height: 82px;
            border: 1px dashed rgba(255,230,0,.55); border-radius: 50%;
            transform: translate(-50%,-50%) scale(var(--halo-scale, .72));
            animation: sxSpin 5s linear infinite;
            box-shadow: 0 0 12px rgba(255,230,0,.15);
        }
        #tufan-widget-root .scan-beam {
            position: absolute; left: -20%; top: 50%; z-index: 10;
            width: 140%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan) 25%, #fff 50%, var(--green) 75%, transparent);
            box-shadow: 0 0 8px var(--cyan), 0 0 14px var(--green);
            animation: sxBeamScan 1.25s ease-in-out infinite; opacity: .8;
        }
        #tufan-widget-root .scan-beam:after {
            content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 21px;
            background: linear-gradient(transparent, rgba(0,234,255,.08), transparent);
        }
        @keyframes sxBeamScan { 0%, 100% { transform: translateY(-37px); opacity: .15; } 50% { transform: translateY(37px); opacity: .95; } }
        #tufan-widget-root .scan-percent {
            position: absolute; right: 9px; top: 28px; z-index: 20;
            color: #fff; font: 700 20px/1 Teko;
            text-shadow: 0 0 8px #fff, 0 0 14px var(--cyan);

        #tufan-widget-root .scan-percent small {
            display: block; color: var(--green);
            font: 700 5px 'Share Tech Mono', monospace;
            letter-spacing: .14em; text-align: right;

        #tufan-widget-root .scan-bottom {
            position: absolute; left: 8px; right: 8px; bottom: 7px; z-index: 20;

        #tufan-widget-root .scan-log {
            max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
            color: #dfffff; font: 700 6.5px 'Share Tech Mono', monospace; letter-spacing: .03em;
        }
        #tufan-widget-root .scan-log span {
            color: var(--gold); text-shadow: 0 0 5px var(--gold);
        }
        #tufan-widget-root .scan-track {
            height: 3px; margin-top: 3px; overflow: hidden; border-radius: 3px;
            background: rgba(255,255,255,.12); box-shadow: inset 0 0 3px #000;

        #tufan-widget-root .scan-track-fill {
            width: calc(var(--scan-progress) * 100%); height: 100%;

            background: linear-gradient(90deg, var(--green), var(--cyan), var(--gold));
            box-shadow: 0 0 8px var(--cyan);
            transition: width .06s linear;
        }
        #tufan-widget-root .scan-glitch {
            position: absolute; inset: 0; z-index: 17; pointer-events: none; opacity: .12;
            background: repeating-linear-gradient(transparent 0 3px, rgba(255,255,255,.15) 4px);
            mix-blend-mode: screen; animation: sxScanNoise .13s steps(2) infinite;
        }
        @keyframes sxScanNoise { 50% { transform: translateX(1px); } }
        #tufan-widget-root .scan-complete-flash {
            position: absolute; inset: 0; z-index: 50; pointer-events: none;
            background: #fff; opacity: 0;
        }
        #tufan-widget-root .scan-complete-flash.fire { animation: sxCompleteFlash .4s ease-out; }
        @keyframes sxCompleteFlash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

           PREDICTION DISPLAY
           ═══════════════════════════════════════════ */
        #tufan-widget-root .pred-display {
            position: absolute; inset: 0; z-index: 31;

            padding: 5px; perspective: 650px;

        #tufan-widget-root .pred-shell {
            position: relative; width: 174px; height: 110px;
            display: flex; align-items: center; gap: 7px;
            padding: 8px 7px 20px;
            border: 1px solid rgba(0,234,255,.45);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
            background: radial-gradient(circle at 30% 50%, rgba(255,230,0,.15), transparent 38%),
                        linear-gradient(145deg, rgba(26,20,0,.94), rgba(0,4,4,.98));

            animation: sxPredReveal .62s cubic-bezier(.17,.9,.24,1.22);

            content: ""; position: absolute; left: -45%; top: -20%;

            transform: skewX(-18deg); pointer-events: none;
            animation: sxPredSweep 2.8s ease-in-out infinite;
        }
        @keyframes sxPredSweep { 60%, 100% { left: 125%; } }

            position: relative; z-index: 4; width: 76px; height: 76px;
            flex: none; display: grid; place-items: center;
            transform-style: preserve-3d; transform: rotateY(-7deg);
        }
        #tufan-widget-root .pod-plate {
            position: absolute; inset: 6px;
            clip-path: polygon(22% 0, 78% 0, 100% 22%, 100% 78%, 78% 100%, 22% 100%, 0 78%, 0 22%);
            background: linear-gradient(145deg, rgba(0,234,255,.28), rgba(0,7,5,.96) 48%, rgba(255,230,0,.18));
            border: 1px solid var(--cyan);
            box-shadow: 0 0 13px rgba(0,234,255,.55), inset 0 0 15px rgba(255,230,0,.25);
            transform: translateZ(7px);
        }
        #tufan-widget-root .pod-plate:before {
            content: ""; position: absolute; inset: 4px;

        #tufan-widget-root .pod-plate:after {

        #tufan-widget-root .pod-ring {
            position: absolute; inset: 0;
            border: 1px solid var(--green); border-radius: 50%;
            transform-style: preserve-3d;
            box-shadow: 0 0 9px rgba(255,230,0,.32);

            transform: rotateX(67deg); animation: sxPodRing1 2.2s linear infinite;
        }
        #tufan-widget-root .pod-ring.r2 {
            inset: 4px; border-color: var(--cyan);
            transform: rotateY(68deg); animation: sxPodRing2 2.7s linear infinite reverse;
        }
        #tufan-widget-root .pod-ring:before {
            content: ""; position: absolute; left: 9px; top: 3px;
            width: 4px; height: 4px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 7px currentColor;
        }
        @keyframes sxPodRing1 { to { transform: rotateX(67deg) rotateZ(360deg); } }
        @keyframes sxPodRing2 { to { transform: rotateY(68deg) rotateZ(360deg); } }
        #tufan-widget-root .number-img-wrap {
            position: relative; z-index: 7; width: 58px; height: 58px;
            display: grid; place-items: center; transform: translateZ(14px);

            display: block; width: 44px; height: 44px; object-fit: contain;

        /* ═══════════════════════════════════════════

           ═══════════════════════════════════════════ */
        function getFallbackPeriod(now) {
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const totalSec = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            const issueToday = Math.floor(totalSec / 30) + 1;
            return `${y}${m}${d}1000${String(issueToday).padStart(4, '0')}`;
        }

        async function fetchRealPeriod() {
            const ts = Date.now();
            const directUrl = `https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=${ts}`;
            const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;

            let res = null;
            try {
                res = await fetch(directUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error();
            } catch(e) {
                try { res = await fetch(fallbackUrl, { cache: 'no-store' }); } catch(e2) { return null; }
            }

            try {
                if (!res || !res.ok) return null;
                const jsonData = await res.json();
                if (jsonData?.data?.list && Array.isArray(jsonData.data.list) && jsonData.data.list.length > 0) {
                    latestMarketHistory = jsonData.data.list;
                    const latest = jsonData.data.list[0];
                    let rawIssue = latest.issueNumber || latest.issue || latest.period;
                    if (!rawIssue) return null;
                    let nextPeriod = (BigInt(rawIssue) + 1n).toString();

                    let actualDrawn = null;
                    if (latest.number !== undefined && latest.number !== null && latest.number !== '') {
                        actualDrawn = Number(latest.number);
                    }
                    return {
                        nextPeriod: nextPeriod,
                        completedIssue: String(rawIssue),
                        drawnNumber: actualDrawn
                    };
                }
            } catch(err) {
                return null;
            }
            return null;
        }

        function getLuckyNumberForSignal(isBig) {
            if (isBig) {
                const bigNums = [5, 6, 7, 8, 9];
                return bigNums[Math.floor(Math.random() * bigNums.length)];
            } else {
                const smallNums = [0, 1, 2, 3, 4];
                return smallNums[Math.floor(Math.random() * smallNums.length)];
            }
        }

        function generateSmartPrediction() {
            let isBig = false;
            let streakText = "NORMAL";

            if (latestMarketHistory && latestMarketHistory.length >= 3) {
                const marketItems = latestMarketHistory.slice(0, 10).map(item => {
                    const num = Number(item.number);
                    return {
                        num: num,
                        size: num >= 5 ? "BIG" : "SMALL"
                    };
                });

                const n = marketItems.length;
                const s = marketItems.map(m => m.size);

                const currentStreakSize = s[0];
                let streakCount = 1;
                for (let i = 1; i < s.length; i++) {
                    if (s[i] === currentStreakSize) {
                        streakCount++;
                    } else {
                        break;
                    }
                }

                /* ══════════════════════════════════════════════
                   ⭐ ২টা বিগ ২টা স্মল (2B-2S PATTERN ENGINE) ⭐
                   ══════════════════════════════════════════════ */
                const is_2_2_shift = (n >= 4 && streakCount === 2 && 
                                      s[0] === s[1] && s[2] === s[3] && 
                                      s[0] !== s[2]);

                const is_2_2_pairing = (n >= 3 && streakCount === 1 && 
                                        s[0] !== s[1] && s[1] === s[2] && 
                                        (n < 4 || s[3] !== s[1]));

                const isAlternating = (n >= 3 && s[0] !== s[1] && s[1] !== s[2]);

                if (is_2_2_shift) {
                    isBig = (currentStreakSize === "SMALL");
                    streakText = "2B-2S SHIFT";
                } else if (is_2_2_pairing) {
                    isBig = (currentStreakSize === "BIG");
                    streakText = "2B-2S PAIR";
                } else if (streakCount >= 3) {
                    isBig = (currentStreakSize === "BIG");
                    streakText = `${currentStreakSize} DRAGON`;
                } else if (isAlternating) {
                    isBig = (s[0] === "SMALL");
                    streakText = "ZIG-ZAG";
                } else if (streakCount === 2) {
                    isBig = (currentStreakSize === "BIG");
                    streakText = `${currentStreakSize} DRAGON`;
                } else {
                    let bigW = 0, smallW = 0;
                    const weights = [5, 4, 3, 2, 1];
                    for (let i = 0; i < Math.min(n, 5); i++) {
                        if (s[i] === "BIG") bigW += weights[i];
                        else smallW += weights[i];
                    }
                    isBig = bigW >= smallW;
                    streakText = isBig ? "BIG MOMENTUM" : "SMALL MOMENTUM";
                }
            } else {
                const lastSig = activePrediction ? activePrediction.signal : 'BIG';
                isBig = (lastSig === 'SMALL');
                streakText = isBig ? "BIG AI" : "SMALL AI";
            }

            const number = getLuckyNumberForSignal(isBig);
            const acc = Math.floor(Math.random() * 6) + 94;

            return { isBig, signal: isBig ? 'BIG' : 'SMALL', number, acc, streakText };
        }

        function getCurrentPeriodEndMs() {
            var now = Date.now();
            var d = new Date(now);
            var sec = d.getSeconds();
            var ms = d.getMilliseconds();
            var secIntoPeriod = sec % 30;
            var msIntoPeriod = secIntoPeriod * 1000 + ms;
            var remainMs = PERIOD_DURATION_MS - msIntoPeriod;
            return now + remainMs;
        }

        /* ═══════════════════════════════════════════
           ⭐ FIREBASE VIP LOGIN SYSTEM ⭐
           ═══════════════════════════════════════════ */
        function grantAccess() {

        /* ═══════════════════════════════════════════

        function showPrediction(predObj) {

            if (accVal) accVal.textContent = predObj.acc + '%';

            if (patternVal) patternVal.textContent = predObj.streakText || 'APEX';

            var basePeriod = lockedPeriod || lastPeriod || getFallbackPeriod(new Date());

            predDisplay.classList.remove('active', 'reveal');
            void predDisplay.offsetWidth;
            predDisplay.classList.add('active', 'reveal');

            startPeriodCountdown();

        /* ═══════════════════════════════════════════
           COUNTDOWN TIMER
           ═══════════════════════════════════════════ */
        function startPeriodCountdown() {
            stopPeriodCountdown();
            periodEndTime = getCurrentPeriodEndMs();

            function tick() {
                var remain = periodEndTime - Date.now();
                if (remain < 0) remain = 0;
                var sec = Math.ceil(remain / 1000);
                var pct = Math.max(0, Math.min(100, (remain / PERIOD_DURATION_MS) * 100));

                if (predTimerText) predTimerText.textContent = sec + 's';
                if (predTimerFill) predTimerFill.style.width = pct + '%';

                if (remain <= 0) {
                    stopPeriodCountdown();
                    onPeriodEnd();
                    return;
                }
                periodCountdownTimer = setTimeout(tick, 200);
            }
            tick();
        }

        function stopPeriodCountdown() {
            if (periodCountdownTimer) {
                clearTimeout(periodCountdownTimer);
                periodCountdownTimer = null;
            }
        }

        /* ═══════════════════════════════════════════
           AUTO LOOP
           ═══════════════════════════════════════════ */
        function startAutoLoop() {
            if (autoLoopActive) return;
            autoLoopActive = true;
            if (loggedIn && !bypassRunning && !wingoHackDone) {
                runBypass();
            }
        }

        function stopAutoLoop() {
            autoLoopActive = false;
            if (autoLoopTimer) {
                clearTimeout(autoLoopTimer);
                autoLoopTimer = null;
            }
            stopPeriodCountdown();
        }

        function onPeriodEnd() {
            if (!autoLoopActive) return;
            if (!loggedIn) return;
            if (bypassRunning) return;

            var now = Date.now();
            if (now - lastTriggeredPeriodEnd < 3000) return;
            lastTriggeredPeriodEnd = now;

            wingoHackDone = false;
            curState = 'home';
            updateUI();

            if (autoLoopTimer) clearTimeout(autoLoopTimer);
            autoLoopTimer = setTimeout(function() {
                if (autoLoopActive && loggedIn && !bypassRunning) {
                    runBypass();
                }
            }, 100);
        }

        /* ═══════════════════════════════════════════

           ═══════════════════════════════════════════ */
        actionBtn.addEventListener('click', function() {
            if (bypassRunning) return;

            if (!loggedIn || curState === 'login') {
                attemptLogin();
                return;
            }

            if (curState === 'home' || (curState === 'wingo' && !wingoHackDone)) {
                runBypass();
            } else if (curState === 'wingo' && wingoHackDone) {
                wingoHackDone = false;
                updateUI();
            }
        });

        /* ═══════════════════════════════════════════
           SCAN SEQUENCE
           ═══════════════════════════════════════════ */
        function runScanSequence(onDone) {
            statusOverlay.classList.remove('show');
            statusOverlay.style.display = 'none';
            predDisplay.classList.remove('active', 'reveal');
            dregEyeRing.style.opacity = '.03';
            stageScanner.classList.add('active');

            stageScanner.style.setProperty('--scan-progress', 0);
            stageScanner.style.setProperty('--halo-scale', .72);
            scanPctText.textContent = '0%';
            scanPhase.textContent = 'VECTOR MAP';
            scanLogText.innerHTML = '[boot] <span>INITIALIZING 3D CORE</span>';

            statusText.textContent = 'SCANNING';
            setActionLabel('SCANNING');

            initScanParticles();
            if (!scanAnimId) renderScanner();

            var phases = [
                { p: 0,    label: 'VECTOR MAP',  log: '[vector] <span>MAPPING DEPTH COORDINATES</span>' },
                { p: .25,  label: 'PHASE LINK',  log: '[phase] <span>SPINNING QUANTUM RINGS</span>' },
                { p: .5,   label: 'CORE FOLD',   log: '[core] <span>FOLDING PARTICLE VORTEX</span>' },
                { p: .75,  label: 'SEED SYNC',   log: '[matrix] <span>SYNCHRONIZING SIGNAL CORE</span>' },
                { p: .92,  label: 'LOCKING',     log: '[lock] <span>FINALIZING SIGNAL</span>' }
            ];
            var duration = SCAN_DURATION_MS;
            var start = performance.now();
            var finished = false;

            function tick(now) {
                if (finished) return;
                var raw = Math.min(1, (now - start) / duration);
                var smooth = raw < .75 ? raw * .96 : raw;
                stageScanner.style.setProperty('--scan-progress', smooth.toFixed(4));
                stageScanner.style.setProperty('--halo-scale', (.72 + smooth * .28).toFixed(3));
                scanPctText.textContent = Math.floor(smooth * 100) + '%';

                for (var i = 0; i < phases.length; i++) {
                    if (smooth >= phases[i].p) {
                        scanPhase.textContent = phases[i].label;
                        scanLogText.innerHTML = phases[i].log;
                    }
                }

                if (raw < 1) return requestAnimationFrame(tick);

                finished = true;
                stageScanner.style.setProperty('--scan-progress', 1);
                stageScanner.style.setProperty('--halo-scale', 1);
                scanPctText.textContent = 'LOCK';
                scanPhase.textContent = 'COMPLETE';
                scanLogText.innerHTML = '[done] <span>3D SIGNAL LOCKED</span>';

                scanFlash.classList.remove('fire');
                void scanFlash.offsetWidth;
                scanFlash.classList.add('fire');

                setTimeout(onDone, 80);
            }
            requestAnimationFrame(tick);
        }

        /* ═══════════════════════════════════════════
           BYPASS / PREDICTION TRIGGER
           ═══════════════════════════════════════════ */
        async function runBypass() {
            if (bypassRunning) return;
            if (!loggedIn) { updateUI(); return; }

            bypassRunning = true;
            wingoHackDone = false;
            curState = 'scan';
            setActionLabel('SCANNING');
            statusText.textContent = 'SCANNING';

            const apiPromise = fetchRealPeriod();

            runScanSequence(async function() {
                bypassRunning = false;
                wingoHackDone = true;

                const apiData = await apiPromise;
                if (apiData && apiData.nextPeriod) {
                    lastPeriod = apiData.nextPeriod;
                } else {
                    lastPeriod = getFallbackPeriod(new Date());
                }

                activePrediction = generateSmartPrediction();
                lockedPrediction = activePrediction;
                lockedPeriod = lastPeriod;

                curState = 'wingo';
                playAudio(activePrediction.signal === 'BIG' ? 'big.mp3' : 'small.mp3');
                try { ZAYRO.speak(activePrediction.signal + ' ' + activePrediction.number); } catch(e) {}
                updateUI();
            });
        }

        /* ═══════════════════════════════════════════
           CANVAS: SCANNER
           ═══════════════════════════════════════════ */
        var hCanvas = document.getElementById('housingScanCanvas');
        var hctx = hCanvas.getContext('2d');
        var scanParticles = [];
        var scanAnimId = 0;
        var scanClock = 0;

        function resizeScannerCanvas() {
            if (!hCanvas || !hCanvas.parentElement) return;
            var d = Math.min(window.devicePixelRatio || 1, 2);
            var w = hCanvas.parentElement.clientWidth || 186;
            var h = hCanvas.parentElement.clientHeight || 122;
            hCanvas.width = w * d;
            hCanvas.height = h * d;
            hCanvas.style.width = w + 'px';
            hCanvas.style.height = h + 'px';
            hctx.setTransform(d, 0, 0, d, 0, 0);
        }

        function initScanParticles() {
            resizeScannerCanvas();
            scanParticles = [];
            for (var i = 0; i < 100; i++) {
                var a = Math.random() * Math.PI * 2;
                var r = 50 + Math.random() * 85;
                scanParticles.push({
                    a: a, r: r,
                    z: -110 + Math.random() * 220,
                    phase: Math.random() * Math.PI * 2,
                    size: .6 + Math.random() * 1.5,
                    color: i % 4 === 0 ? '#ffe600' : (i % 3 === 0 ? '#00eaff' : '#ffe600')
                });
            }
        }

        function project3D(x, y, z, cx, cy) {
            var f = 160 / (160 + z);
            return { x: cx + x * f, y: cy + y * f, s: f };
        }

        function renderScanner() {
            var w = hCanvas.clientWidth || 186;
            var h = hCanvas.clientHeight || 122;
            var cx = w / 2;
            var cy = h / 2;
            hctx.clearRect(0, 0, w, h);
            scanClock += .06;

            var p = parseFloat(stageScanner.style.getPropertyValue('--scan-progress')) || 0;
            var ease = 1 - Math.pow(1 - p, 3);
            var points = [];

            for (var i = 0; i < scanParticles.length; i++) {
                var q = scanParticles[i];
                var ring = (i % 5 < 3 ? 31 : 19) * (1 - Math.max(0, p - .88) * 5.5);
                var ang = q.a + scanClock * (i % 2 ? 1 : -1) * (1.2 + p * 2.2);
                var targetX = Math.cos(ang) * ring;
                var targetY = Math.sin(ang * 2 + q.phase) * 13;
                var targetZ = Math.sin(ang) * ring;
                var scatterX = Math.cos(q.a) * q.r;
                var scatterY = Math.sin(q.a) * q.r * .65;
                var scatterZ = q.z;
                var x = scatterX + (targetX - scatterX) * ease;
                var y = scatterY + (targetY - scatterY) * ease;
                var z = scatterZ + (targetZ - scatterZ) * ease;
                if (p > .93) {
                    var collapse = (p - .93) / .07;
                    x *= 1 - collapse * .55;
                    y *= 1 - collapse * .55;
                    z *= 1 - collapse * .55;
                }
                var pt = project3D(x, y, z, cx, cy);
                pt.color = q.color;
                pt.size = Math.max(.4, q.size * pt.s);
                points.push(pt);
            }

            points.sort(function(a, b) { return a.s - b.s; });

            if (p > .34) {
                hctx.lineWidth = .45;
                for (var k = 0; k < points.length; k += 5) {
                    var a2 = points[k];
                    var b2 = points[(k + 7) % points.length];
                    var dx = a2.x - b2.x;
                    var dy = a2.y - b2.y;
                    if (dx * dx + dy * dy < 1000) {
                        hctx.strokeStyle = 'rgba(0,234,255,' + (.08 + p * .2) + ')';
                        hctx.beginPath();
                        hctx.moveTo(a2.x, a2.y);
                        hctx.lineTo(b2.x, b2.y);
                        hctx.stroke();
                    }
                }
            }

            points.forEach(function(pt) {
                hctx.save();
                hctx.globalAlpha = .45 + p * .55;
                hctx.fillStyle = pt.color;
                hctx.shadowBlur = 5;
                hctx.shadowColor = pt.color;
                hctx.beginPath();
                hctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                hctx.fill();
                hctx.restore();
            });

            hctx.save();
            hctx.strokeStyle = 'rgba(255,230,0,' + (p * .5) + ')';
            hctx.lineWidth = 1;
            hctx.beginPath();
            hctx.arc(cx, cy, 8 + p * 13, scanClock, scanClock + Math.PI * 1.45);
            hctx.stroke();
            hctx.restore();

            scanAnimId = requestAnimationFrame(renderScanner);
        }

        function stopScannerCanvas() {
            if (scanAnimId) { cancelAnimationFrame(scanAnimId); scanAnimId = 0; }
            hctx.clearRect(0, 0, hCanvas.clientWidth || 186, hCanvas.clientHeight || 122);
        }

        /* ═══════════════════════════════════════════
           PING
           ═══════════════════════════════════════════ */
        setInterval(function() {
            document.getElementById('statPing').textContent = (15 + Math.floor(Math.random() * 8)) + 'MS';
        }, 1600);

        /* ═══════════════════════════════════════════
           DRAG SYSTEM
           ═══════════════════════════════════════════ */
        var PANEL_W = 218;
        var PANEL_H = 276;
        var orbPos = { x: window.innerWidth - 48, y: window.innerHeight - 150 };
        var panelPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function setOrbPos(x, y) {
            var w = orbEl.offsetWidth || 58;
            var h = orbEl.offsetHeight || 58;
            orbPos.x = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2));
            orbPos.y = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2));
            orbEl.style.transform = 'translate3d(' + orbPos.x + 'px,' + orbPos.y + 'px,0)';
        }

        function setPanelPos(x, y) {
            var w = cardOuter.offsetWidth || PANEL_W;
            var h = cardOuter.offsetHeight || PANEL_H;
            panelPos.x = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2));
            panelPos.y = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2));
            mainPanel.style.transform = 'translate3d(' + panelPos.x + 'px,' + panelPos.y + 'px,0)';
        }

        setOrbPos(orbPos.x, orbPos.y);
        setPanelPos(panelPos.x, panelPos.y);

        var orbDragging = false;
        var orbMoved = false;
        var orbStart = { x: 0, y: 0 };
        var orbRAFQueued = false;

        orbEl.addEventListener('pointerdown', function(e) {
            orbDragging = true;
            orbMoved = false;
            orbStart.x = e.clientX;
            orbStart.y = e.clientY;
            try { orbEl.setPointerCapture(e.pointerId); } catch(err) {}
            e.preventDefault();
        });

        orbEl.addEventListener('pointermove', function(e) {
            if (!orbDragging) return;
            var dx = e.clientX - orbStart.x;
            var dy = e.clientY - orbStart.y;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) orbMoved = true;
            if (!orbMoved) return;
            orbEl.style.animation = 'none';
            orbPos.x += dx;
            orbPos.y += dy;
            orbStart.x = e.clientX;
            orbStart.y = e.clientY;
            if (!orbRAFQueued) {
                orbRAFQueued = true;
                requestAnimationFrame(function() {
                    orbRAFQueued = false;
                    setOrbPos(orbPos.x + 29, orbPos.y + 29);
                });
            }
        });

        function orbEnd(e) {
            if (!orbDragging) return;
            orbDragging = false;
            orbEl.style.animation = '';
            if (!orbMoved) openPanel();
            orbMoved = false;
            if (e) { try { orbEl.releasePointerCapture(e.pointerId); } catch(err) {} }
        }

        orbEl.addEventListener('pointerup', orbEnd);
        orbEl.addEventListener('pointercancel', orbEnd);

        var panelDragging = false;
        var panelStart = { x: 0, y: 0 };
        var panelRAFQueued = false;

        mainPanel.addEventListener('pointerdown', function(e) {
            if (e.target.closest('button')) return;
            if (e.target.closest('input')) return;
            if (e.target.closest('.status-overlay')) return;
            panelDragging = true;
            mainPanel.classList.add('dragging');
            panelStart.x = e.clientX;
            panelStart.y = e.clientY;
            try { mainPanel.setPointerCapture(e.pointerId); } catch(err) {}
        });

        mainPanel.addEventListener('pointermove', function(e) {
            if (!panelDragging) return;
            panelPos.x += (e.clientX - panelStart.x);
            panelPos.y += (e.clientY - panelStart.y);
            panelStart.x = e.clientX;
            panelStart.y = e.clientY;
            if (!panelRAFQueued) {
                panelRAFQueued = true;
                requestAnimationFrame(function() {
                    panelRAFQueued = false;
                    setPanelPos(
                        panelPos.x + (cardOuter.offsetWidth || PANEL_W) / 2,
                        panelPos.y + (cardOuter.offsetHeight || PANEL_H) / 2
                    );
                });
            }
        });

        function panelEnd(e) {
            panelDragging = false;
            mainPanel.classList.remove('dragging');
            if (e) { try { mainPanel.releasePointerCapture(e.pointerId); } catch(err) {} }
        }

        mainPanel.addEventListener('pointerup', panelEnd);
        mainPanel.addEventListener('pointercancel', panelEnd);

        function openPanel() {
            orbEl.classList.add('hidden');
            mainPanel.classList.add('visible');
            setPanelPos(window.innerWidth / 2, window.innerHeight / 2);
            updateUI();
        }

        function closePanel() {
            mainPanel.classList.remove('visible');
            setTimeout(function() {
                orbEl.classList.remove('hidden');
                setOrbPos(panelPos.x + PANEL_W / 2, panelPos.y + PANEL_H / 2);
            }, 220);
        }

        closeBtn.addEventListener('click', closePanel);

        /* ═══════════════════════════════════════════
           UI UPDATER
           ═══════════════════════════════════════════ */
        function updateUI() {
            if (bypassRunning) return;

            if (!loggedIn || curState === 'login') {
                statusText.textContent = 'LOCKED';
                showStatus();
                setStatusUI('VIP KEY AUTH', 'ACCESS LOCKED', 'ENTER VIP KEY TO CONTINUE');
                pwInputWrap.classList.add('show');
                pwInputWrap.style.display = 'block';
                setActionLabel('LOGIN');
                setTimeout(function() { try { pwInput.focus(); } catch(e) {} }, 400);
            } else if (curState === 'home') {
                statusText.textContent = 'ARMED';
                showStatus();
                pwInputWrap.classList.remove('show');
                pwInputWrap.style.display = 'none';
                setStatusUI('SYSTEM READY', 'VIP ACCESS OK', 'AUTO-SCANNING...');
                setActionLabel('EXECUTE');
            } else if (curState === 'wingo') {
                pwInputWrap.classList.remove('show');
                pwInputWrap.style.display = 'none';
                if (wingoHackDone && lockedPrediction) {
                    statusText.textContent = 'LOCKED';
                    showPrediction(lockedPrediction);
                    setActionLabel('NEXT');
                } else {
                    statusText.textContent = 'ARMED';
                    showStatus();
                    setStatusUI('TARGET ACQUIRED', 'VIP ACTIVE', 'PRESS EXECUTE TO SCAN');
                    setActionLabel('EXECUTE');
                }
            }
        }

        /* ═══════════════════════════════════════════
           REAL-TIME PERIOD BOUNDARY WATCHER
           ═══════════════════════════════════════════ */
        var lastKnownSecondSlot = -1;
        setInterval(function() {
            var d = new Date();
            var sec = d.getSeconds();
            var slot = Math.floor(sec / 30);
            var minute = d.getMinutes();
            var boundaryKey = minute * 2 + slot;

            if (lastKnownSecondSlot === -1) {
                lastKnownSecondSlot = boundaryKey;
                return;
            }

            if (boundaryKey !== lastKnownSecondSlot) {
                lastKnownSecondSlot = boundaryKey;
                if (autoLoopActive && loggedIn && wingoHackDone && !bypassRunning) {
                    onPeriodEnd();
                }
            }
        }, 200);

        /* ═══════════════════════════════════════════
           BOOT
           ═══════════════════════════════════════════ */
        window.addEventListener('resize', function() {
            setOrbPos(orbPos.x + 29, orbPos.y + 29);
            setPanelPos(panelPos.x + PANEL_W / 2, panelPos.y + PANEL_H / 2);
        });

        window.onload = function() {
            initBackgroundVideos();
            curState = 'login';
            updateUI();
            fetchRealPeriod();
            setInterval(fetchRealPeriod, 3000);
        };

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopPeriodCountdown();
            } else {
                if (autoLoopActive && wingoHackDone) {
                    var remain = periodEndTime - Date.now();
                    if (remain <= 0) onPeriodEnd();
                    else startPeriodCountdown();
                }
            }
        });

    })();
    
</script>
</html>
